# AREI symbol table: conversion fields only.
# Read by tools/svg_to_symbol.py (writes src/huiselek/symbol_data/<id>.json).
# Read by src/huiselek/symbols.py (anchor, points; the conversion fields above are ignored there).
#
# anchor     name of the point that the layout positions (the symbol lands with this point on x, y)
# points     name -> [x, y] in the symbol's own frame (mm, the frame of its JSON), base orientation:
#              a, b     the two ends of a two-terminal device on a line, or the ends of a mark's base line
#              in       where the incoming line meets an end device (free end of its wire stub, else
#                       the point on the outline on the side the official image shows the lead);
#                       the lead arrives from the left, except sockets: from above, onto the stem
#              out      second terminal where there is one (transformer)
#              center   a mark (conductors, three_phase, ...) is placed centred on a cable
#              label    text position for a count number or label (not on the geometry)
# scale      not supported yet (sizes are tuned in M3)
#
# source     svg file relative to docs/reference/arei/
# official   stems of the official table images (docs/reference/arei/official/images) that show it
# rotate     degrees clockwise (0/90/180/270) so the symbol has the orientation of the official image
# keep_text  text that belongs to the symbol; all other library text is a placeholder and is dropped
# mirror     optional, vertical (top<->bottom) or horizontal (left<->right); applied before rotate
# drop       optional, indices of primitives to remove, counted in the primitive list produced from
#            the SVG (after text filtering, in output order, before mirror/rotate/translate); one
#            comment per drop says what goes
# text_at    optional, {text: [x, y]}: baseline position (mm) of that kept text in the final
#            (rotated and translated) symbol frame, whose origin is the top-left of the geometry
# add        optional, list of primitives (same JSON shape as symbol_data/<id>.json: type + its fields,
#            text included) appended in the final symbol frame, i.e. after drop/mirror/rotate/translate
#            and text_at (if drop leaves no geometry, the frame is the rotated source frame). Then the
#            symbol is re-translated so the bounding box of all geometry starts at (0, 0), which also
#            shifts text; `points` must be given in the frame after that shift.
#
# The official image wins over the library. The library master converter_dc_ac is broken
# (no sine wave), and the master converter_ac_dc actually shows DC top-left / AC bottom-right,
# which is the IEC DC->AC (inverter) form with the input top-left (official p8_03). So
# converter_dc_ac uses converter_ac_dc.svg unrotated, and converter_ac_dc (AC top-left,
# DC bottom-right, official p8_01) uses the same file rotated by 180.

