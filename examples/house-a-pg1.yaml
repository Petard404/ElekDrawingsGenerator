# House A, page 1: supply, main breaker, 300 mA, Diff 1 with circuits I to K, the 32 A breaker and
# its circuits N to P. Diff 2 (page 2) is left out until the page links exist (M4).
project:
  address: "Straat A 1, 0000 Gemeente"
  drawn_by: "Ontwerper"
  executed_by: "Installateur"

labels:
  breaker: "{rating_a}A"
  differential: "{sensitivity_ma} mA\n{pole_count}x{rating_a} A"
  differential_type: ""
  supply_voltage: "3*230 V"

pages:
  - {id: pg1, title: "Pagina 1: aansluiting"}

