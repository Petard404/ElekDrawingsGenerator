# House A, pages 1 to 4: connection, Diff 1 (page 1), Diff 2 (page 2) and the two lighting detail
# pages (3: circuit A, 4: circuit G).
#
# Left out until M5: circuit F (transformer F1, converter F2; 6 A, XVB 3x2.5, "Transformators").
# Nothing else of the inventory is left out.
#
# Corrections against the original drawing:
# - Circuit B's socket is labelled J1 in the original, which duplicates the ID of socket J1 of
#   circuit J: it is B1 here.
# - The differentials are DF0, DF1 and DF2 (page 1 of the original had D0, D1): the IDs D1 and D2
#   belong to the sockets of circuit D and IDs must be unique.
# - The original page 2 carries the title "Pagina 1: aansluiting"; here "Differentieel 2".
# - The original page 4 title reads "verlicthting 2de verdiep" (typo); here "Verlichting 2de
#   verdiep G". All titles drop the "Pagina n:" prefix (the page number is drawn by the tool).
# - The "Naar/Van" links and the page numbers come from the tool, not from typed text.
project:
  address: "Straat A 1, 0000 Gemeente"
  drawn_by: "Ontwerper"
  executed_by: "Installateur"

labels:
  breaker: "{rating_a}A"
  differential: "{sensitivity_ma} mA\n{pole_count}x{rating_a} A"
  differential_type: ""
  supply_voltage: "3*230 V"

pages:
